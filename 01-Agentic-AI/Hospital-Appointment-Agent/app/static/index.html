<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduler Bot</title>
    <style>
        /* ── Enterprise design tokens (light) ── */
        :root {
            --bg: #f4f6f9; --card: #ffffff; --surface-2: #f8fafc;
            --border: #e2e8f0; --border-strong: #cbd5e1;
            --text: #1e293b; --muted: #64748b;
            --accent: #2563eb; --accent-hover: #1d4ed8;
            --green: #16a34a; --red: #dc2626; --yellow: #d97706; --orange: #d97706; --purple: #7c3aed;
            --bot-bubble: #ffffff; --user-bubble: #2563eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

        /* ── Icon system ── */
        .icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; width: 18px; height: 18px; flex: none; }
        .icon-sm { width: 14px; height: 14px; }
        .icon-lg { width: 20px; height: 20px; }
        .section-title .icon { color: var(--accent); }
        .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
        .dot-green { background: var(--green); } .dot-red { background: var(--red); } .dot-muted { background: var(--border-strong); }
        .slot-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
        .slot-dot.available { background: var(--green); } .slot-dot.booked { background: var(--red); } .slot-dot.weekend { background: var(--border-strong); }

        /* ── App shell: sidebar | main ── */
        .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .app-shell.collapsed { grid-template-columns: 64px 1fr; }
        .sidebar { background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden; }
        .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 16px 14px; border-bottom: 1px solid var(--border); }
        .brand-logo { flex: none; width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; }
        .brand-text h1 { font-size: 13px; font-weight: 700; line-height: 1.3; }
        .brand-text p { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
        .sidebar-nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: none; background: transparent; border-radius: 6px; font: inherit; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: left; transition: background 0.15s, color 0.15s; }
        .nav-item:hover { background: var(--surface-2); color: var(--text); }
        .nav-item.active { background: rgba(37, 99, 235, 0.08); color: var(--accent); font-weight: 600; position: relative; }
        .nav-item.active::before { content: ''; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 2px; background: var(--accent); }
        .sidebar-footer { padding: 10px; border-top: 1px solid var(--border); }
        .collapse-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: transparent; border-radius: 6px; font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; }
        .collapse-btn:hover { background: var(--surface-2); color: var(--text); }
        .app-shell.collapsed .brand-text, .app-shell.collapsed .nav-item span, .app-shell.collapsed .collapse-btn span { display: none; }
        .app-shell.collapsed .nav-item, .app-shell.collapsed .collapse-btn { justify-content: center; padding: 9px 0; }
        .app-shell.collapsed .sidebar-brand { justify-content: center; padding: 16px 0; }

        /* ── Top app bar ── */
        .appbar { height: 56px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 20px; position: sticky; top: 0; z-index: 10; }
        .hamburger { display: none; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; }
        .appbar-title { font-size: 15px; font-weight: 600; }
        .appbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
        .status-pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; background: rgba(22, 163, 74, 0.1); color: var(--green); font-size: 12px; font-weight: 600; }
        .status-pill.offline { background: rgba(220, 38, 38, 0.1); color: var(--red); }
        .status-pill-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .appbar-meta { font-size: 12px; color: var(--muted); }
        .meta-sep { margin: 0 6px; color: var(--border-strong); }

        .content { padding: 24px; max-width: 1200px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 28px; margin-bottom: 24px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06); }
        .view { display: none; } .view.active { display: block; }

        /* ── Chat UI ── */
        .chat-card { position: relative; display: flex; flex-direction: column; height: calc(100vh - 56px - 48px); min-height: 480px; padding: 0; overflow: hidden; }
        .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .chat-header-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .chat-header-title .icon { color: var(--accent); }
        .chat-header-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .chat-header-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .msg { max-width: 75%; padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg.bot { background: var(--card); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; align-self: flex-start; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05); }
        .msg.user { background: var(--user-bubble); color: white; border-radius: 16px 4px 16px 16px; align-self: flex-end; box-shadow: 0 1px 2px rgba(37, 99, 235, 0.25); }
        .msg .bot-avatar { display: inline-flex; padding: 5px; box-sizing: content-box; width: 16px; height: 16px; border-radius: 6px; background: rgba(37, 99, 235, 0.1); color: var(--accent); vertical-align: -6px; margin-right: 8px; }
        .msg-booking { background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--green); border-radius: 8px; padding: 14px 16px; margin-top: 10px; font-size: 13px; }
        .msg-booking .booking-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border); }
        .msg-booking .booking-row:last-child { border-bottom: none; padding-bottom: 0; }
        .msg-booking .booking-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; flex: none; }
        .msg-booking .booking-value { font-weight: 600; text-align: right; word-break: break-word; }
        .typing-indicator { display: none; position: absolute; bottom: 76px; left: 24px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; gap: 4px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05); }
        .typing-indicator.active { display: flex; }
        .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: typingBounce 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
        .chat-input-area { border-top: 1px solid var(--border); padding: 16px 24px; display: flex; gap: 12px; align-items: flex-end; }
        .chat-input { flex: 1; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 14px; font-size: 14px; font-family: inherit; resize: none; min-height: 48px; max-height: 120px; line-height: 1.5; }
        .chat-input:focus { outline: none; border-color: var(--accent); }
        .chat-input::placeholder { color: var(--muted); }
        .chat-send-btn { background: var(--accent); color: white; border: none; border-radius: 12px; padding: 14px 20px; font-size: 18px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; min-width: 48px; height: 48px; }
        .chat-send-btn:hover:not(:disabled) { background: var(--accent-hover); }
        .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-reset-btn { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .chat-reset-btn:hover { color: var(--text); border-color: var(--accent); }
        .chat-quick-actions { padding: 8px 24px 0; display: flex; gap: 8px; flex-wrap: wrap; }
        .quick-btn { background: var(--card); border: 1px solid var(--border-strong); border-radius: 6px; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 500; color: var(--text); cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .quick-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(37, 99, 235, 0.05); }
        .quick-btn .icon { color: var(--muted); transition: color 0.2s; }
        .quick-btn:hover .icon { color: var(--accent); }
        .chat-error { display: none; margin: 0 24px 8px; padding: 10px 14px; background: rgba(220, 38, 38, 0.08); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 8px; color: var(--red); font-size: 13px; }
        .chat-error.active { display: block; }

        /* ── Admin views ── */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 24px; }
        @media (max-width: 800px) { .cal-grid { grid-template-columns: repeat(2, 1fr); } }
        .cal-day { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: box-shadow 0.15s, border-color 0.15s; }
        .cal-day:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(15, 23, 42, 0.07); }
        .cal-day-header { padding: 8px 10px; font-size: 12px; font-weight: 600; text-align: center; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.5px; background: var(--surface-2); }
        .cal-day-header.weekend { color: var(--muted); background: transparent; }
        .cal-day-header.weekday { color: var(--text); }
        .cal-slot { padding: 5px 8px 5px 10px; font-size: 11px; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
        .cal-slot:last-child { border-bottom: none; }
        .cal-slot:hover { background: var(--surface-2); }
        .cal-slot-time { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
        .cal-slot.available { border-left-color: var(--green); color: var(--text); }
        .cal-slot.booked { border-left-color: var(--red); color: var(--text); }
        .cal-slot.weekend { border-left-color: var(--border-strong); color: var(--muted); opacity: 0.7; }
        .cal-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
        .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border-strong); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; white-space: nowrap; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        td:first-child { color: var(--muted); font-variant-numeric: tabular-nums; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--surface-2); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; border: 1px dashed var(--border-strong); border-radius: 8px; background: var(--surface-2); }
        .badge { padding: 2px 10px; border-radius: 999px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
        .badge-mock { background: rgba(124, 58, 237, 0.12); color: var(--purple); }
        .badge-twilio { background: rgba(22, 163, 74, 0.12); color: var(--green); }
        .badge-skip { background: rgba(100, 116, 139, 0.12); color: var(--muted); }
        .badge-error { background: rgba(220, 38, 38, 0.12); color: var(--red); }
        .refresh-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        button.secondary { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text); transition: background 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        button.secondary:hover { background: var(--border); }
        .phone-cell { display: inline-flex; align-items: center; gap: 6px; }
        .phone-text { font-family: monospace; font-size: 12px; }
        .phone-eye { cursor: pointer; -webkit-user-select: none; user-select: none; opacity: 0.6; transition: opacity 0.2s; }
        .phone-eye:hover { opacity: 1; }

        /* ── Utility classes (JS-generated markup) ── */
        .cal-loading { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 20px; }
        .cal-date { font-size: 10px; opacity: 0.7; }
        .slot-meta { display: flex; align-items: center; gap: 4px; font-size: 10px; }
        .mono-val { font-family: monospace; font-size: 11px; }
        .truncate-body { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .error-text { color: var(--red); }
        .sprite-defs { display: none; }

        /* ── Responsive: off-canvas sidebar ── */
        .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 30; }
        @media (max-width: 900px) {
            .app-shell, .app-shell.collapsed { grid-template-columns: 1fr; }
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; transform: translateX(-100%); transition: transform 0.25s ease; z-index: 40; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12); }
            .sidebar.open { transform: translateX(0); }
            .app-shell.collapsed .brand-text, .app-shell.collapsed .nav-item span, .app-shell.collapsed .collapse-btn span { display: revert; }
            .app-shell.collapsed .nav-item, .app-shell.collapsed .collapse-btn { justify-content: flex-start; padding: 9px 10px; }
            .collapse-btn { display: none; }
            .hamburger { display: inline-flex; }
            .sidebar-backdrop.show { display: block; }
            .appbar-meta { display: none; }
            .content { padding: 16px; }
        }
        @media (max-width: 1024px) {
            .content { padding: 16px; }
            .card { padding: 20px; }
        }
        @media (max-width: 640px) {
            .msg { max-width: 85%; }
            .chat-header { flex-wrap: wrap; gap: 8px; }
            .appbar { padding: 0 12px; }
            .content { padding: 12px; }
        }

        /* ── Polish: scrollbars, focus, reduced motion ── */
        *::-webkit-scrollbar { width: 8px; height: 8px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        *::-webkit-scrollbar-thumb:hover { background: var(--muted); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
        .chat-input:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
            .chat-messages { scroll-behavior: auto; }
        }
    </style>
</head>
<body>

<div class="app-shell" id="appShell">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg></div>
            <div class="brand-text">
                <h1>Appointment Scheduler &amp; Confirmation Bot</h1>
                <p>LangChain · FastAPI · Ollama Cloud</p>
            </div>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" id="navChat" onclick="switchView('chat')"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><span>Chat</span></button>
            <button class="nav-item" id="navCalendar" onclick="switchView('calendar')"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg><span>Calendar</span></button>
            <button class="nav-item" id="navBookings" onclick="switchView('bookings')"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span>Bookings</span></button>
            <button class="nav-item" id="navSms" onclick="switchView('sms')"><svg class="icon" aria-hidden="true"><use href="#i-sms"/></svg><span>SMS History</span></button>
        </nav>
        <div class="sidebar-footer">
            <button class="collapse-btn" id="collapseBtn" onclick="toggleSidebarCollapsed()"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-left"/></svg><span>Collapse</span></button>
        </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileSidebar()"></div>

    <!-- MAIN -->
    <div class="main-col">
        <header class="appbar">
            <button class="hamburger" id="hamburgerBtn" onclick="toggleMobileSidebar()" aria-label="Toggle menu"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
            <div class="appbar-title" id="appbarTitle">Chat</div>
            <div class="appbar-right">
                <div class="status-pill" id="statusPill">
                    <span class="status-pill-dot" id="healthDot"></span>
                    <span id="healthStatus">Checking…</span>
                </div>
                <div class="appbar-meta">
                    <span id="healthModel">—</span><span class="meta-sep">·</span>SMS: <span id="healthSms">—</span>
                </div>
            </div>
        </header>

        <main class="content">
            <!-- CHAT VIEW -->
            <div class="view active" id="userView">
                <div class="card chat-card">
                    <div class="chat-header">
                        <div class="chat-header-title"><svg class="icon" aria-hidden="true"><use href="#i-bot"/></svg> Scheduler Bot</div>
                        <div class="chat-header-status">
                            <div class="chat-header-dot" id="chatStatusDot"></div>
                            <span id="chatStatusText">Online</span>
                            <button class="chat-reset-btn" onclick="resetChat()"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-new-chat"/></svg> New Chat</button>
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="typing-indicator" id="typingIndicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <div class="chat-quick-actions" id="quickActions">
                        <div class="quick-btn" onclick="sendQuickMessage('I want to book an appointment')"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-cal-plus"/></svg> Book appointment</div>
                        <div class="quick-btn" onclick="sendQuickMessage('I need to reschedule my appointment')"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-clock"/></svg> Reschedule</div>
                        <div class="quick-btn" onclick="sendQuickMessage('I want to cancel my appointment')"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-cal-x"/></svg> Cancel</div>
                        <div class="quick-btn" onclick="sendQuickMessage('What departments are available?')"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-help"/></svg> Inquiry</div>
                    </div>
                    <div class="chat-error" id="chatError"></div>
                    <div class="chat-input-area">
                        <textarea class="chat-input" id="chatInput" placeholder="Type your message..." rows="1" onkeydown="handleChatKey(event)" oninput="autoResize(this)"></textarea>
                        <button class="chat-send-btn" id="chatSendBtn" onclick="sendMessage()" aria-label="Send"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button>
                    </div>
                </div>
            </div>

            <!-- CALENDAR VIEW -->
            <div class="view" id="calendarView">
                <div class="card">
                    <div class="section-title"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg> Calendar — Week View</div>
                    <div class="refresh-row"><button class="secondary" onclick="loadCalendar()"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-refresh"/></svg> Refresh</button></div>
                    <div class="cal-grid" id="calGrid"></div>
                    <div class="cal-legend">
                        <span><span class="dot dot-green"></span>Available</span>
                        <span><span class="dot dot-red"></span>Booked</span>
                        <span><span class="dot dot-muted"></span>Weekend / Closed</span>
                    </div>
                </div>
            </div>

            <!-- BOOKINGS VIEW -->
            <div class="view" id="bookingsView">
                <div class="card">
                    <div class="section-title"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg> Booking History</div>
                    <div class="refresh-row"><button class="secondary" onclick="loadBookings()"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-refresh"/></svg> Refresh</button></div>
                    <div class="table-wrap" id="bookingsTable"></div>
                </div>
            </div>

            <!-- SMS VIEW -->
            <div class="view" id="smsView">
                <div class="card">
                    <div class="section-title"><svg class="icon" aria-hidden="true"><use href="#i-sms"/></svg> SMS Sent History</div>
                    <div class="refresh-row"><button class="secondary" onclick="loadSmsHistory()"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-refresh"/></svg> Refresh</button></div>
                    <div class="table-wrap" id="smsTable"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    const API = '';
    const SESSION_ID = 'web-' + Date.now();
    let isTyping = false;

    /* ── Navigation ── */
    const VIEW_TITLES = { chat: 'Chat', calendar: 'Calendar — Week View', bookings: 'Booking History', sms: 'SMS History' };
    const VIEW_MAP = { chat: ['navChat', 'userView'], calendar: ['navCalendar', 'calendarView'], bookings: ['navBookings', 'bookingsView'], sms: ['navSms', 'smsView'] };

    function switchView(view) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(VIEW_MAP[view][0]).classList.add('active');
        document.getElementById(VIEW_MAP[view][1]).classList.add('active');
        document.getElementById('appbarTitle').textContent = VIEW_TITLES[view];
        if (view === 'calendar') loadCalendar();
        if (view === 'bookings') loadBookings();
        if (view === 'sms') loadSmsHistory();
        closeMobileSidebar();
    }

    function toggleSidebarCollapsed() {
        document.getElementById('appShell').classList.toggle('collapsed');
    }

    function toggleMobileSidebar() {
        const sb = document.getElementById('sidebar');
        const bd = document.getElementById('sidebarBackdrop');
        sb.classList.toggle('open');
        bd.classList.toggle('show', sb.classList.contains('open'));
    }

    function closeMobileSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarBackdrop').classList.remove('show');
    }

    async function checkHealth() {
        const pill = document.getElementById('statusPill');
        try {
            const r = await fetch(API + '/api/health'); const d = await r.json();
            pill.classList.remove('offline');
            document.getElementById('healthStatus').textContent = 'Operational';
            document.getElementById('healthModel').textContent = d.llm_model;
            document.getElementById('healthSms').textContent = d.sms_mode;
        } catch (e) {
            pill.classList.add('offline');
            document.getElementById('healthStatus').textContent = 'Offline';
            document.getElementById('chatStatusDot').style.background = 'var(--red)';
            document.getElementById('chatStatusText').textContent = 'Offline';
        }
    }
    checkHealth();

    function addMessage(role, content, bookingData) {
        const container = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
        if (role === 'bot') {
            msgDiv.innerHTML = '<svg class="icon bot-avatar" aria-hidden="true"><use href="#i-bot"/></svg>' + escapeHtml(content);
        } else {
            msgDiv.textContent = content;
        }
        if (bookingData && bookingData.scheduled_datetime) {
            const bookingDiv = document.createElement('div');
            bookingDiv.className = 'msg-booking';
            const ext = bookingData.extracted || {};
            bookingDiv.innerHTML = `
                <div class="booking-row"><span class="booking-label">Patient</span><span class="booking-value">${ext.patient_name || '—'}</span></div>
                <div class="booking-row"><span class="booking-label">Department</span><span class="booking-value">${ext.department || '—'}</span></div>
                <div class="booking-row"><span class="booking-label">Scheduled</span><span class="booking-value">${formatDateTime(bookingData.scheduled_datetime)}</span></div>
                <div class="booking-row"><span class="booking-label">Phone</span><span class="booking-value">${phoneCell(ext.contact_phone)}</span></div>
                <div class="booking-row"><span class="booking-label">SMS SID</span><span class="booking-value mono-val">${bookingData.confirmation_message_sid || '—'}</span></div>
            `;
            msgDiv.appendChild(bookingDiv);
        }
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showTyping() {
        isTyping = true;
        document.getElementById('typingIndicator').classList.add('active');
        document.getElementById('chatSendBtn').disabled = true;
        document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
    }

    function hideTyping() {
        isTyping = false;
        document.getElementById('typingIndicator').classList.remove('active');
        document.getElementById('chatSendBtn').disabled = false;
    }

    function showError(msg) {
        const el = document.getElementById('chatError');
        el.textContent = msg;
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 5000);
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function handleChatKey(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function sendQuickMessage(msg) {
        document.getElementById('chatInput').value = msg;
        sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || isTyping) return;
        addMessage('user', text);
        input.value = '';
        input.style.height = 'auto';
        document.getElementById('quickActions').style.display = 'none';
        showTyping();
        try {
            const r = await fetch(API + '/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, session_id: SESSION_ID })
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const d = await r.json();
            hideTyping();
            addMessage('bot', d.reply, d);
        } catch (e) {
            hideTyping();
            showError('Connection failed: ' + e.message + '. Make sure the proxy and server are running.');
            addMessage('bot', "I'm having trouble connecting right now. Please make sure the Ollama Cloud proxy is running and try again.");
        }
    }

    async function resetChat() {
        try {
            await fetch(API + '/api/chat/reset?session_id=' + SESSION_ID, { method: 'POST' });
        } catch (e) { /* ignore */ }
        document.getElementById('chatMessages').innerHTML = '';
        document.getElementById('quickActions').style.display = 'flex';
        addMessage('bot', "Hi! I'm Scheduler Bot. I can help you book, reschedule, or cancel appointments. What can I do for you today?");
    }

    // Initial greeting
    addMessage('bot', "Hi! I'm Scheduler Bot. I can help you book, reschedule, or cancel appointments.\n\nJust tell me what you need — for example:\n• \"I want to book a cardiology appointment\"\n• \"I need to see a dermatologist next Monday\"\n• \"Cancel my appointment\"\n\nWhat can I do for you today?");

    function formatDateTime(dt) {
        if (!dt) return null;
        try { return new Date(dt).toLocaleString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
        catch { return dt; }
    }

    function maskPhone(phone) {
        if (!phone) return '';
        const first3 = phone.slice(0, 3);
        const rest = phone.slice(3);
        return first3 + 'x'.repeat(Math.max(rest.length, 3));
    }

    function phoneCell(phone) {
        if (!phone) return '—';
        const masked = maskPhone(phone);
        const escaped = phone.replace(/'/g, "\\'");
        return `<span class="phone-cell"><span class="phone-text" data-revealed="false">${masked}</span><svg class="icon icon-sm phone-eye" onclick="togglePhone(this, '${escaped}')" title="Show/hide number" aria-hidden="true"><use href="#i-eye"/></svg></span>`;
    }

    function togglePhone(el, full) {
        const use = el.querySelector('use');
        const textEl = el.parentElement.querySelector('.phone-text');
        if (textEl.dataset.revealed === 'true') {
            textEl.textContent = maskPhone(full);
            textEl.dataset.revealed = 'false';
            use.setAttribute('href', '#i-eye');
        } else {
            textEl.textContent = full;
            textEl.dataset.revealed = 'true';
            use.setAttribute('href', '#i-eye-off');
        }
    }

    async function loadCalendar() {
        const grid = document.getElementById('calGrid');
        grid.innerHTML = '<div class="cal-loading">Loading...</div>';
        try {
            const r = await fetch(API + '/api/calendar/week'); const d = await r.json();
            grid.innerHTML = d.days.map(day => `
                <div class="cal-day">
                    <div class="cal-day-header ${day.is_weekend ? 'weekend' : 'weekday'}">${day.weekday}<br><span class="cal-date">${day.date}</span></div>
                    ${day.slots.map(s => `<div class="cal-slot ${s.status}"><span class="cal-slot-time">${s.time}</span><span class="slot-meta"><span class="slot-dot ${s.status}"></span>${s.booking && s.booking.patient_name ? `<span class="slot-meta">${s.booking.patient_name}</span>` : ''}</span></div>`).join('')}
                </div>`).join('');
        } catch (e) { grid.innerHTML = '<div class="cal-loading error-text">Failed to load calendar</div>'; }
    }

    async function loadBookings() {
        const el = document.getElementById('bookingsTable');
        el.innerHTML = '<div class="empty-state">Loading...</div>';
        try {
            const r = await fetch(API + '/api/calendar/bookings'); const d = await r.json();
            if (!d.bookings.length) { el.innerHTML = '<div class="empty-state">No bookings yet. Chat with the bot to make one.</div>'; return; }
            el.innerHTML = `<table><thead><tr><th>#</th><th>Date/Time</th><th>Patient</th><th>Department</th><th>Phone</th><th>SMS SID</th><th>Booked At</th></tr></thead><tbody>${d.bookings.map((b, i) => `<tr><td>${i + 1}</td><td>${formatDateTime(b.datetime)}</td><td>${b.patient_name}</td><td>${b.department}</td><td>${phoneCell(b.contact_phone)}</td><td class="mono-val">${b.sms_sid}</td><td>${formatDateTime(b.booked_at)}</td></tr>`).join('')}</tbody></table>`;
        } catch (e) { el.innerHTML = '<div class="empty-state error-text">Failed to load bookings</div>'; }
    }

    async function loadSmsHistory() {
        const el = document.getElementById('smsTable');
        el.innerHTML = '<div class="empty-state">Loading...</div>';
        try {
            const r = await fetch(API + '/api/sms/history'); const d = await r.json();
            if (!d.messages.length) { el.innerHTML = '<div class="empty-state">No SMS messages sent yet.</div>'; return; }
            el.innerHTML = `<table><thead><tr><th>#</th><th>SID</th><th>To</th><th>Mode</th><th>Body</th><th>Sent At</th></tr></thead><tbody>${d.messages.map((m, i) => `<tr><td>${i + 1}</td><td class="mono-val">${m.sid}</td><td>${phoneCell(m.to_number)}</td><td><span class="badge badge-${m.mode}">${m.mode}</span></td><td class="truncate-body" title="${m.body}">${m.body}</td><td>${formatDateTime(m.sent_at)}</td></tr>`).join('')}</tbody></table>`;
        } catch (e) { el.innerHTML = '<div class="empty-state error-text">Failed to load SMS history</div>'; }
    }
</script>
</body>
</html>
