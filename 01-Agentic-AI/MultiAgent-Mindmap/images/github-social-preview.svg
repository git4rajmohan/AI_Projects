<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#1a2338"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#38d39f"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#9db0d0" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- ═══ subtle grid texture ═══ -->
  <g opacity="0.05" stroke="#6ea8fe">
    <line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/><line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- ═══ LEFT: title block ═══ -->
  <text x="80" y="165" fill="#9db0d0" font-size="19" font-weight="600" letter-spacing="4">AGENTIC AI · MULTI-AGENT ORCHESTRATION</text>
  <text x="80" y="252" fill="#e6ecf7" font-size="60" font-weight="800">Mindmap Orchestrator</text>
  <rect x="80" y="282" width="380" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="342" fill="#c9d6ec" font-size="24">Unstructured content in — structured knowledge out.</text>
  <text x="80" y="379" fill="#9db0d0" font-size="20">Creator → Reviewer → Reviser agent workflow with</text>
  <text x="80" y="409" fill="#9db0d0" font-size="20">iterative feedback loops &amp; deterministic rendering.</text>

  <!-- tech chips -->
  <g font-size="16" font-weight="600">
    <rect x="80" y="475" width="150" height="42" rx="21" fill="#1e2740" stroke="#38d39f"/>
    <text x="155" y="502" text-anchor="middle" fill="#38d39f">🐍 Python</text>
    <rect x="245" y="475" width="170" height="42" rx="21" fill="#1e2740" stroke="#6ea8fe"/>
    <text x="330" y="502" text-anchor="middle" fill="#6ea8fe">⚡ Streamlit</text>
    <rect x="430" y="475" width="150" height="42" rx="21" fill="#1e2740" stroke="#f7b955"/>
    <text x="505" y="502" text-anchor="middle" fill="#f7b955">🦙 Ollama</text>
    <rect x="595" y="475" width="180" height="42" rx="21" fill="#1e2740" stroke="#9db0d0"/>
    <text x="685" y="502" text-anchor="middle" fill="#9db0d0">🗺️ markmap.js</text>
  </g>

  <!-- local-first badge -->
  <rect x="80" y="552" width="430" height="40" rx="20" fill="none" stroke="#38d39f" stroke-dasharray="6 3"/>
  <text x="295" y="578" text-anchor="middle" fill="#38d39f" font-size="17" font-weight="600">🔒 100% local · no cloud APIs · your data stays yours</text>

  <!-- ═══ RIGHT: agent review loop diagram ═══ -->
  <g>
    <!-- cycle arrows between three nodes -->
    <!-- Creator (top) -->
    <rect x="880" y="95" width="240" height="70" rx="14" fill="#23304e" stroke="#6ea8fe" stroke-width="2"/>
    <text x="1000" y="125" text-anchor="middle" fill="#e6ecf7" font-size="19" font-weight="700">✍️ Schema Creator</text>
    <text x="1000" y="149" text-anchor="middle" fill="#9db0d0" font-size="14">proposes JSON mindmap</text>

    <!-- Reviewer (right-bottom) -->
    <rect x="1030" y="290" width="220" height="70" rx="14" fill="#2a2413" stroke="#f7b955" stroke-width="2"/>
    <text x="1140" y="320" text-anchor="middle" fill="#e6ecf7" font-size="19" font-weight="700">🔍 Schema Reviewer</text>
    <text x="1140" y="344" text-anchor="middle" fill="#9db0d0" font-size="14">grades on 6 criteria</text>

    <!-- Reviser (left-bottom) -->
    <rect x="750" y="290" width="220" height="70" rx="14" fill="#1e2740" stroke="#38d39f" stroke-width="2"/>
    <text x="860" y="320" text-anchor="middle" fill="#e6ecf7" font-size="19" font-weight="700">♻️ Reviser</text>
    <text x="860" y="344" text-anchor="middle" fill="#9db0d0" font-size="14">applies feedback · loops</text>

    <!-- arrows: Creator → Reviewer → Reviser → Creator -->
    <path d="M 1090 165 Q 1160 215 1150 286" fill="none" stroke="#9db0d0" stroke-width="2.5" marker-end="url(#arr)"/>
    <path d="M 1026 340 Q 1000 348 974 340" fill="none" stroke="#9db0d0" stroke-width="2.5" marker-end="url(#arr)"/>
    <path d="M 850 290 Q 830 215 902 168" fill="none" stroke="#9db0d0" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- loop label -->
    <text x="1000" y="255" text-anchor="middle" fill="#9db0d0" font-size="15" font-weight="600">until approved</text>

    <!-- output arrow -->
    <path d="M 1000 360 Q 1000 420 1000 452" fill="none" stroke="#38d39f" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="870" y="458" width="260" height="64" rx="14" fill="#14251d" stroke="#38d39f" stroke-width="2.5"/>
    <text x="1000" y="486" text-anchor="middle" fill="#e6ecf7" font-size="19" font-weight="700">🗺️ Interactive Mindmap</text>
    <text x="1000" y="510" text-anchor="middle" fill="#9db0d0" font-size="14">deterministic · validated · exportable</text>
  </g>
</svg>