<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Seevaram Rajmohan - AI/ML Engineering Portfolio. English / Japanese welcome.">
<title>Seevaram Rajmohan | AI/ML Portfolio</title>
<style>
:root { --navy:#0e2148; --navy2:#153061; --blue:#2563eb; --ink:#172033; --muted:#5b687a; --line:#dce3ed; }
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 16px;
  background:linear-gradient(135deg,#eef3fb 0%,#f8fafd 100%);
  color:var(--ink); font-family:"Segoe UI",system-ui,-apple-system,"Yu Gothic","Meiryo",sans-serif;
  line-height:1.55;
}
.card {
  width:min(100%,420px); overflow:hidden; background:#fff;
  border-radius:18px; box-shadow:0 12px 44px rgba(20,35,70,.14);
}
.hero { background:linear-gradient(160deg,var(--navy),var(--navy2)); padding:34px 24px 28px; text-align:center; }
.avatar {
  width:64px; height:64px; margin:0 auto 14px; border-radius:50%;
  display:grid; place-items:center; background:var(--blue);
  color:#fff; font-weight:750; font-size:22px; letter-spacing:.04em;
  box-shadow:0 0 0 4px rgba(37,99,235,.22);
}
.hero h1 { margin:0; font-size:24px; color:#fff; letter-spacing:.01em; }
.hero p { margin:6px 0 0; font-size:13px; color:#c7d6f2; }
.body { padding:24px 24px 26px; }
.welcome { text-align:center; margin:0 0 20px; }
.welcome div[lang=en] { font-size:15px; font-weight:600; color:var(--ink); }
.welcome div[lang=ja] { font-size:13px; color:var(--muted); margin-top:2px; }
.lang { display:flex; gap:10px; }
.lang button {
  flex:1; padding:12px 0; font:inherit; font-size:14px; font-weight:650;
  border-radius:10px; cursor:pointer; transition:.15s ease;
  border:1px solid var(--line); background:#fff; color:var(--muted);
}
.lang button:first-child { border-color:var(--blue); background:var(--blue); color:#fff; }
.lang button:last-child:hover, .lang button:first-child:hover { filter:brightness(.97); }
.actions { display:grid; gap:10px; margin-top:18px; }
.actions[hidden] { display:none; }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 14px; border-radius:10px; text-decoration:none;
  font-size:14.5px; font-weight:650; transition:.15s ease;
}
.btn svg { width:18px; height:18px; flex:none; }
.btn-primary { background:var(--blue); color:#fff; border:1px solid var(--blue); }
.btn-primary:hover { filter:brightness(.95); }
.btn-secondary { background:#fff; color:var(--blue); border:1px solid var(--line); }
.btn-secondary:hover { border-color:var(--blue); }
.back { display:block; margin:16px auto 0; background:none; border:none; font:inherit; font-size:13px; color:var(--muted); cursor:pointer; padding:4px 10px; border-radius:8px; }
.back:hover { color:var(--blue); background:#f0f5fd; }
.foot { text-align:center; font-size:11px; color:var(--muted); padding:0 0 20px; }
</style>
</head>
<body>
<main class="card">
  <header class="hero">
    <div class="avatar">SR</div>
    <h1>Seevaram Rajmohan</h1>
    <p>AI / ML Engineer · AI評価エンジニア</p>
  </header>

  <div class="body">
    <div class="welcome">
      <div lang="en">Welcome to my site, please select your option</div>
      <div lang="ja">私のサイトへようこそ。オプションをお選びください</div>
    </div>

    <div class="lang" id="langrow">
      <button type="button" id="btn-en" lang="en" aria-label="View in English">English</button>
      <button type="button" id="btn-ja" lang="ja" aria-label="日本語で表示">日本語</button>
    </div>

    <div class="actions" id="actions" hidden>
      <a class="btn btn-primary" id="link-portfolio" href="https://github.com/git4rajmohan/AI_Projects#readme">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span id="portfolio-label">GitHub Portfolio</span>
      </a>
      <a class="btn btn-secondary" id="link-linkedin" href="https://www.linkedin.com/in/seevaram-rajmohan-04a4a04a/">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.55V9h3.57v11.45z"/></svg>
        LinkedIn
      </a>
    </div>

    <button type="button" class="back" id="btn-back" hidden>← Back</button>
  </div>

  <div class="foot">© <span id="year"></span> Seevaram Rajmohan</div>
</main>

<script>
const T = {
  en: { portfolio: 'GitHub Portfolio', url: 'https://github.com/git4rajmohan/AI_Projects#readme' },
  ja: { portfolio: 'GitHub ポートフォリオ', url: 'https://github.com/git4rajmohan/AI_Projects/blob/main/README.ja.md' },
};
const $ = (id) => document.getElementById(id);
document.getElementById('year').textContent = new Date().getFullYear();
const q = new URLSearchParams(location.search).get('lang');
if (q === 'en' || q === 'ja') choose(q);
function choose(lang) {
  $('link-portfolio').querySelector('span').textContent = T[lang].portfolio;
  $('link-portfolio').href = T[lang].url;
  document.documentElement.lang = lang;
  $('langrow').hidden = true;
  document.querySelector('.welcome').hidden = true;
  $('actions').hidden = false;
  $('btn-back').hidden = false;
}
$('btn-en').addEventListener('click', () => choose('en'));
$('btn-ja').addEventListener('click', () => choose('ja'));
$('btn-back').addEventListener('click', () => {
  history.replaceState(null, '', location.pathname);
  $('langrow').hidden = false;
  document.querySelector('.welcome').hidden = false;
  $('actions').hidden = true;
  $('btn-back').hidden = true;
  document.documentElement.lang = 'en';
});
</script>
</body>
</html>
