<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- ═══ background ═══ -->
  <rect width="1180" height="400" fill="#0f1420"/>

  <!-- ═══ title ═══ -->
  <text x="590" y="38" text-anchor="middle" fill="#e6ecf7" font-size="22" font-weight="700">Agentic AI Multi-Agent Mindmap Orchestrator — System Architecture</text>
  <text x="590" y="58" text-anchor="middle" fill="#9db0d0" font-size="12">local-first pipeline · Creator → Reviewer → Reviser loop · deterministic rendering</text>

  <!-- ═══ stage 1 : input ═══ -->
  <rect x="30" y="110" width="190" height="120" rx="10" fill="#131a2a" stroke="#6ea8fe" stroke-width="1.5"/>
  <text x="125" y="132" text-anchor="middle" fill="#6ea8fe" font-size="11" font-weight="700" letter-spacing="1">1 · INPUT UI</text>
  <rect x="45" y="145" width="160" height="70" rx="7" fill="#23304e" stroke="#6ea8fe"/>
  <text x="125" y="166" text-anchor="middle" fill="#e6ecf7" font-size="12" font-weight="700">app.py · Streamlit</text>
  <text x="125" y="184" text-anchor="middle" fill="#9db0d0" font-size="10">⚡ Fast Mode · 🤖 Agent Mode</text>
  <text x="125" y="200" text-anchor="middle" fill="#9db0d0" font-size="10">📁 Upload · ▶️ YouTube · ✏️ Paste</text>

  <!-- ═══ stage 2 : extraction ═══ -->
  <rect x="255" y="110" width="200" height="120" rx="10" fill="#131a2a" stroke="#38d39f" stroke-width="1.5"/>
  <text x="355" y="132" text-anchor="middle" fill="#38d39f" font-size="11" font-weight="700" letter-spacing="1">2 · EXTRACTION</text>
  <rect x="270" y="145" width="170" height="70" rx="7" fill="#1e2740" stroke="#38d39f"/>
  <text x="355" y="166" text-anchor="middle" fill="#e6ecf7" font-size="12" font-weight="700">input_handler.py</text>
  <text x="355" y="184" text-anchor="middle" fill="#9db0d0" font-size="10">utf-8 → latin-1 decode chain</text>
  <text x="355" y="200" text-anchor="middle" fill="#9db0d0" font-size="10">video-ID regex · transcript fetch</text>

  <!-- ═══ stage 3 : generation ═══ -->
  <rect x="490" y="90" width="250" height="160" rx="10" fill="#131a2a" stroke="#38d39f" stroke-width="1.5"/>
  <text x="615" y="112" text-anchor="middle" fill="#38d39f" font-size="11" font-weight="700" letter-spacing="1">3 · GENERATION</text>
  <rect x="505" y="124" width="220" height="52" rx="7" fill="#1e2740" stroke="#38d39f"/>
  <text x="615" y="145" text-anchor="middle" fill="#e6ecf7" font-size="12" font-weight="700">⚡ mindmap_generator.py</text>
  <text x="615" y="163" text-anchor="middle" fill="#9db0d0" font-size="10">single-pass LLM prompt</text>
  <rect x="505" y="186" width="220" height="52" rx="7" fill="#1e2740" stroke="#f7b955"/>
  <text x="615" y="207" text-anchor="middle" fill="#e6ecf7" font-size="12" font-weight="700">🤖 agent_pipeline.py</text>
  <text x="615" y="225" text-anchor="middle" fill="#9db0d0" font-size="10">schema ⇄ review ⇄ revise loop</text>

  <!-- ═══ ollama (external) ═══ -->
  <g>
    <path d="M545 300 c0 -12 32 -20 70 -20 c38 0 70 8 70 20 l0 44 c0 12 -32 20 -70 20 c-38 0 -70 -8 -70 -20 z" fill="#20161c" stroke="#ff7a7a" stroke-width="1.5" stroke-dasharray="6 3"/>
    <ellipse cx="615" cy="300" rx="70" ry="20" fill="#20161c" stroke="#ff7a7a" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="615" y="322" text-anchor="middle" fill="#e6ecf7" font-size="12" font-weight="700">🦙 Ollama</text>
    <text x="615" y="338" text-anchor="middle" fill="#9db0d0" font-size="10">gpt-oss:120b · localhost:11434/v1</text>
  </g>

  <!-- ═══ stage 4 : rendering ═══ -->
  <rect x="775" y="110" width="200" height="120" rx="10" fill="#131a2a" stroke="#f7b955" stroke-width="1.5"/>
  <text x="875" y="132" text-anchor="middle" fill="#f7b955" font-size="11" font-weight="700" letter-spacing="1">4 · RENDERING</text>
  <rect x="790" y="145" width="170" height="34" rx="7" fill="#1e2740" stroke="#38d39f"/>
  <text x="875" y="167" text-anchor="middle" fill="#e6ecf7" font-size="11.5" font-weight="700">renderer.py · json-inject</text>
  <rect x="790" y="187" width="170" height="34" rx="7" fill="#262013" stroke="#f7b955"/>
  <text x="875" y="209" text-anchor="middle" fill="#e6ecf7" font-size="11.5" font-weight="700">markmap_template.html</text>

  <!-- ═══ stage 5 : output ═══ -->
  <rect x="1010" y="110" width="145" height="120" rx="10" fill="#131a2a" stroke="#9db0d0" stroke-width="1.5"/>
  <text x="1082" y="132" text-anchor="middle" fill="#9db0d0" font-size="11" font-weight="700" letter-spacing="1">5 · OUTPUT</text>
  <rect x="1022" y="145" width="120" height="70" rx="7" fill="#14251d" stroke="#38d39f" stroke-width="2"/>
  <text x="1082" y="168" text-anchor="middle" fill="#e6ecf7" font-size="11" font-weight="700">🗺️ Interactive</text>
  <text x="1082" y="184" text-anchor="middle" fill="#e6ecf7" font-size="11" font-weight="700">mindmap</text>
  <text x="1082" y="202" text-anchor="middle" fill="#9db0d0" font-size="10">⬇️ .html / .md</text>

  <!-- ═══ main flow arrows ═══ -->
  <line x1="220" y1="180" x2="252" y2="180" stroke="#38d39f" stroke-width="2"/>
  <polygon points="252,180 244,176 244,184" fill="#38d39f"/>
  <text x="236" y="172" text-anchor="middle" fill="#9db0d0" font-size="9">raw input</text>

  <line x1="455" y1="180" x2="487" y2="180" stroke="#38d39f" stroke-width="2"/>
  <polygon points="487,180 479,176 479,184" fill="#38d39f"/>
  <text x="471" y="172" text-anchor="middle" fill="#9db0d0" font-size="9">clean text</text>

  <line x1="740" y1="170" x2="772" y2="170" stroke="#38d39f" stroke-width="2"/>
  <polygon points="772,170 764,166 764,174" fill="#38d39f"/>
  <text x="756" y="162" text-anchor="middle" fill="#9db0d0" font-size="9">markdown</text>

  <line x1="975" y1="180" x2="1007" y2="180" stroke="#9db0d0" stroke-width="2"/>
  <polygon points="1007,180 999,176 999,184" fill="#9db0d0"/>
  <text x="991" y="172" text-anchor="middle" fill="#9db0d0" font-size="9">HTML</text>

  <!-- ═══ LLM call arrows (dashed) ═══ -->
  <line x1="615" y1="238" x2="615" y2="278" stroke="#ff7a7a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="615,278 611,270 619,270" fill="#ff7a7a"/>
  <text x="700" y="262" text-anchor="middle" fill="#ff7a7a" font-size="9">OpenAI-compatible chat API</text>

  <!-- ═══ legend ═══ -->
  <g font-size="10" fill="#9db0d0">
    <rect x="330" y="378" width="11" height="11" rx="3" fill="#38d39f"/>
    <text x="346" y="387">Python module</text>
    <rect x="440" y="378" width="11" height="11" rx="3" fill="#6ea8fe"/>
    <text x="456" y="387">Streamlit UI</text>
    <rect x="546" y="378" width="11" height="11" rx="3" fill="#ff7a7a"/>
    <text x="562" y="387">External LLM runtime (dashed = network call)</text>
    <rect x="800" y="378" width="11" height="11" rx="3" fill="#f7b955"/>
    <text x="816" y="387">Static asset</text>
    <rect x="896" y="378" width="11" height="11" rx="3" fill="#9db0d0"/>
    <text x="912" y="387">Output</text>
  </g>
</svg>